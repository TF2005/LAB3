<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
    <!-- Link the HTML to the the JavaScript file instead of putting it at the end of the body-->
    <!--defer allows to download the JS without runnin git until fully reading the HTML-->
</head>

<body>
    <div class="page">
        <header>
            <h1>My To-Do List</h1>
        </header>
        <main>
            <form id="taskForm"> <!-- In this block, the tasks will be added -->
                <input id="taskInput" type="text">
                <button type="submit">Add</button>
            </form>
            <p id="errorMessage"></p> <!-- If input invalid, the client will get this message -->
            <ul id="taskList"></ul> <!-- JS will add the tasks in this list -->
        </main>
    </div>
</body>

</html>
